name: mcw-meteo
base: core26
version: "0.1.2"
summary: Publishes OpenWeather data to an MQTT topic
description: |
  Polls the OpenWeather current-weather API on a configurable interval and
  publishes a normalized JSON reading to a configurable MQTT topic over either
  a TCP or unix-domain-socket broker connection. Configured via snapd confdb.

confinement: strict
grade: stable

platforms:
    amd64:
        build-on: [amd64]
        build-for: [amd64]
    arm64:
        build-on: [arm64]
        build-for: [arm64]

apps:
  weatherstationd:
    command: bin/weatherstationd
    daemon: simple
    restart-condition: on-failure
    plugs:
      - network
      - mqtt-socket

parts:
  weatherstationd:
    plugin: nil
    source: .
    build-snaps:
      - go/1.26/stable
    # Cross-compile the daemon for the target platform. In destructive mode the
    # go plugin builds for the host arch (and `go install` refuses to
    # cross-compile with GOBIN set), so build explicitly with GOARCH taken from
    # the build-for target. CGO is disabled so no arch-specific C toolchain is
    # required, keeping cross-builds reproducible.
    build-environment:
      - GOOS: linux
      - GOARCH: $CRAFT_ARCH_BUILD_FOR
      - CGO_ENABLED: "0"
    override-build: |
      go build -o "$CRAFT_PART_INSTALL/bin/weatherstationd" ./cmd/weatherstationd
  hooks:
    plugin: dump
    source: snap/local
    organize:
      configuration: etc/configuration

plugs:
  weather-admin:
    interface: confdb
    account: bpyPt7Qr2Qbui3MJMgyzZ3WaQkyj6OkU
    view: weather/admin
    role: custodian

  # Read-only view, available for future observer snaps.
  weather-state:
    interface: confdb
    account: bpyPt7Qr2Qbui3MJMgyzZ3WaQkyj6OkU
    view: weather/state
    role: custodian

  # Shares a broker's unix socket directory for the unix:// transport.
  mqtt-socket:
    interface: content
    content: mqtt-socket
    target: $SNAP_DATA/mqtt

hooks:
  change-view-weather-admin:
    plugs: [weather-admin]
  observe-view-weather-admin:
    plugs: [weather-admin]
  connect-plug-weather-admin:
    plugs: [weather-admin]
